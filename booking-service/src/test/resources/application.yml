spring:
  application:
    name: booking-service
  config:
    import: "optional:configserver:"
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
eureka:
  client:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info