name: Cinema App CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run tests - discovery-server
        run: mvn test --no-transfer-progress
        working-directory: discovery-server

      - name: Run tests - config-server
        run: mvn test --no-transfer-progress
        working-directory: config-server

      - name: Run tests - user-service
        run: mvn test --no-transfer-progress
        working-directory: user-service

      - name: Run tests - cinema-service
        run: mvn test --no-transfer-progress
        working-directory: cinema-service

      - name: Run tests - movie-service
        run: mvn test --no-transfer-progress
        working-directory: movie-service

      - name: Run tests - booking-service
        run: mvn test --no-transfer-progress
        working-directory: booking-service

      - name: Run tests - notification-service
        run: mvn test --no-transfer-progress
        working-directory: notification-service

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build all services
        run: |
          for service in discovery-server config-server api-gateway user-service cinema-service movie-service booking-service notification-service; do
            echo "Building $service..."
            cd $service
            mvn clean package -DskipTests --no-transfer-progress
            cd ..
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker images
        run: docker compose build

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy dev environment
        run: echo "Deploy to development environment"
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Deploy production environment
        run: echo "Deploy to production environment"
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}