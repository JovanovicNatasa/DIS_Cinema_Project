spring:
  application:
    name: api-gateway
  config:
    import: configserver:http://eureka:eureka-secret@config-server:8888

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://eureka:eureka-secret@discovery-server:8761/eureka/
  instance:
    prefer-ip-address: true