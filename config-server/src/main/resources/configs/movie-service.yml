server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://movie-db:5432/moviedb
    username: postgres
    password: postgres
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  defer-datasource-initialization: true

eureka:
  client:
    service-url:
      defaultZone: http://eureka:eureka-secret@discovery-server:8761/eureka/
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus