server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://movie-db:5432/moviedb
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://eureka:eureka-secret@discovery-server:8761/eureka/
  instance:
    prefer-ip-address: true